name: voter_reconciler
description: Indian Panchayat vs Vidhan Sabha Electoral Roll Reconciler using Gemini API and Fuzzy Matching.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  http: ^1.2.1
  excel: ^4.0.3
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
